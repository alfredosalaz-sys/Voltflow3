name: Voltflow3 basic quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find modules -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          if [ -d workers ]; then find workers -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check; fi
      - name: Check release consistency
        run: node tools/check-release-integrity.cjs
      - name: Verify no whitespace errors in last commit
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
